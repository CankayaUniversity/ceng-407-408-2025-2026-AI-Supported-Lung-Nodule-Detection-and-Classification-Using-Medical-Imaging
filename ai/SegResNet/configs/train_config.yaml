# ============================================================================
# SegResNet Training Configuration
# 2.5D Lung Nodule Segmentation on LIDC-IDRI
# ============================================================================

# Data paths
data:
  train_dir: "data/lidc_25d/train"        # Training samples directory
  val_dir: "data/lidc_25d/val"            # Validation samples directory
  test_dir: "data/lidc_25d/test"          # Test samples directory (optional)

# Model configuration
model:
  name: "segresnet"
  in_channels: 5                          # 2.5D input: 5 slices
  out_channels: 1                         # Binary segmentation (nodule/background)
  init_filters: 8                         # Initial number of filters
  dropout_prob: 0.2                       # Dropout for regularization

# Training configuration
training:
  num_epochs: 100
  batch_size: 16
  learning_rate: 1.0e-3                   # Adam learning rate
  checkpoint_dir: "outputs/checkpoints"
  loss_weights:
    dice: 0.5                             # Weight for Dice loss
    bce: 0.5                              # Weight for BCE loss
  device: "cuda"                          # cuda or cpu
  mixed_precision: false                  # Use mixed precision training (optional)

# Data loading
dataloader:
  num_workers: 4                          # Number of worker processes
  pin_memory: true                        # Pin memory for GPU transfer
  shuffle_train: true
  shuffle_val: false

# Learning rate scheduler
scheduler:
  name: "ReduceLROnPlateau"
  factor: 0.5                             # Multiply LR by this when metric plateaus
  patience: 5                             # Epochs before reducing LR

# Validation and checkpointing
validation:
  val_interval: 1                         # Validate every N epochs
  save_best_only: true                    # Only save checkpoint if validation improves
  metric: "dice"                          # Metric to monitor (dice or loss)

# Augmentation (in transforms.py)
augmentation:
  enabled: true
  flip_probability: 0.5
  rotation_range: [-10, 10]               # Degrees
  gamma_range: [0.9, 1.1]

# Image normalization
normalization:
  hu_min: -1200                           # Minimum HU value to consider
  hu_max: 200                             # Maximum HU value to consider

# Logging
logging:
  log_dir: "outputs/logs"
  log_interval: 10                        # Log every N batches
  save_interval: 5                        # Save checkpoint every N epochs

# ============================================================================
# Notes:
# - For GPU training: Make sure cuda=true and device=cuda
# - For CPU training: Set device=cpu and reduce batch_size if OOM
# - Adjust learning_rate if loss doesn't decrease (start with 1e-3, try 1e-4 if unstable)
# - Increase dropout_prob if overfitting observed
# - Reduce batch_size if running into memory issues
# ============================================================================